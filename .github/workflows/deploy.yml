name: Deploy to Production

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CONTEXT.md'
      - 'ARCH_REVIEW.md'
      - 'ARCH_DECISIONS_PLAN.md'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  check:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create environment file
        run: |
          cat > .env << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM=${{ secrets.EMAIL_FROM }}
          EOF

      - name: Backend lint + test
        if: needs.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          npm ci
          npm run lint
          npm test

      - name: Frontend lint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint

  deploy:
    needs: [changes, check]
    if: |
      !cancelled() && 
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t rsa exe.dev >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no exe.dev \
            "ssh tagooza 'cd /home/exedev/nabeeh && git fetch origin master && git reset --hard origin/master'"

      - name: Build and deploy backend
        if: needs.changes.outputs.backend == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no exe.dev \
            "ssh tagooza 'cd /home/exedev/nabeeh && docker compose -f docker-compose.prod.yml build backend && docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans backend'"

      - name: Wait for backend health
        if: needs.changes.outputs.backend == 'true'
        run: sleep 10

      - name: Build and deploy frontend
        if: needs.changes.outputs.frontend == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no exe.dev \
            "ssh tagooza 'cd /home/exedev/nabeeh && docker compose -f docker-compose.prod.yml build frontend && docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans frontend'"

      - name: Wait for frontend health
        if: needs.changes.outputs.frontend == 'true'
        run: sleep 15

      - name: Verify containers
        run: |
          sleep 5
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no exe.dev \
            "ssh tagooza 'docker ps --format \"table {{.Names}}\t{{.Status}}\"'"

      - name: Health check
        run: |
          curl -sf https://nabeeh.app/api/health || echo "Health check failed"

      - name: Cleanup old Docker images
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no exe.dev \
            "ssh tagooza 'docker image prune -f && docker builder prune -f --keep-storage 500MB'"
