name: Tenancy Guard

on:
  pull_request:
    paths:
      - 'backend/routes/**'
      - 'backend/lib/**'
      - 'database/migrations/**'
      - 'scripts/check-tenant-scope.sh'
      - 'scripts/check-tenant-rls.sh'
      - 'scripts/tenant-scope-allowlist.txt'
  push:
    branches: [master]
    paths:
      - 'backend/routes/**'
      - 'backend/lib/**'
      - 'database/migrations/**'

jobs:
  tenant-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every service-role query carries an owner predicate or allowlist entry
        run: ./scripts/check-tenant-scope.sh
      - name: Every tenant table has RLS plus policy (auth_audit_log excepted)
        run: ./scripts/check-tenant-rls.sh
      - name: Backend unit tests
        working-directory: backend
        run: npm ci && npm test
